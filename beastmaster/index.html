let phaserGame = null;

function initSetupUI() {
  const countryGrid = document.getElementById('country-grid');
  const athleteGrid = document.getElementById('athlete-grid');

  COUNTRIES.forEach((country) => {
    const btn = document.createElement('button');
    btn.className = 'country-btn' + (country.code === GameState.selectedCountry.code ? ' selected' : '');
    const flagCanvas = document.createElement('canvas');
    flagCanvas.width = 16;
    flagCanvas.height = 12;
    flagCanvas.className = 'flag-canvas';
    drawPixelFlag(flagCanvas, country.flagType);

    const label = document.createElement('span');
    label.textContent = country.name;

    btn.appendChild(flagCanvas);
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      SFX.ensureContext();
      SFX.tactileClick();
      GameState.selectedCountry = country;
      document.getElementById('selected-country-code').textContent = country.code;
      document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      refreshAthletePortraits();
    });

    countryGrid.appendChild(btn);
  });

  ATHLETES.forEach((athlete) => {
    const btn = document.createElement('button');
    btn.className = 'athlete-btn' + (athlete.id === GameState.selectedAthlete.id ? ' selected' : '');
    const portrait = document.createElement('canvas');
    portrait.width = 16;
    portrait.height = 16;
    portrait.className = 'portrait-canvas';
    portrait.dataset.athleteId = athlete.id;
    drawAthletePortrait(portrait, athlete, GameState.selectedCountry);

    const label = document.createElement('span');
    label.textContent = athlete.name;

    btn.appendChild(portrait);
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      SFX.ensureContext();
      SFX.tactileClick();
      GameState.selectedAthlete = athlete;
      document.getElementById('selected-athlete-name').textContent = athlete.name;
      document.querySelectorAll('.athlete-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });

    athleteGrid.appendChild(btn);
  });
}

function refreshAthletePortraits() {
  document.querySelectorAll('.portrait-canvas').forEach((canvas) => {
    const id = parseInt(canvas.dataset.athleteId, 10);
    const athlete = ATHLETES.find(a => a.id === id);
    drawAthletePortrait(canvas, athlete, GameState.selectedCountry);
  });
}

function buildScoreTableHTML(res) {
  const thrusterTotal = res.thruster1Pts + res.thruster2Pts;
  return `
    <tr><td>🔺 TRIANGLES (${res.trianglesCount} × 5)</td><td>+${res.trianglePts}</td></tr>
    <tr><td>⚡ THRUSTERS</td><td>+${thrusterTotal}</td></tr>
    <tr><td>⏱️ TIME BONUS (${res.time.toFixed(1)}s)</td><td>+${res.timeBonus}</td></tr>
  `;
}

function buildCompareHTML(res, targetScore) {
  const got = res.total;
  const passed = res.completed && got >= targetScore;
  const diff = Math.max(0, targetScore - got);
  const pct = Math.min(100, Math.round((got / Math.max(1, targetScore)) * 100));

  let stampHTML = '';
  if (!res.completed) {
    stampHTML = `<div class="stamp-badge stamp-fail">💦 IN THE WATER!</div>`;
  } else if (passed) {
    stampHTML = `<div class="stamp-badge stamp-pass">★ BEAT GOAL! ★</div>`;
  } else {
    stampHTML = `<div class="stamp-badge stamp-fail">SHORT BY ${diff} PTS</div>`;
  }

  return `
    <div class="big-compare-grid">
      <div class="compare-card" style="border-color:${passed ? '#4ade80' : '#facc15'};">
        <div class="label">🏆 YOU GOT</div>
        <div class="big-num" style="color:${passed ? '#4ade80' : '#facc15'};">${got}</div>
      </div>
      <div class="compare-card" style="border-color:#38bdf8;">
        <div class="label">🎯 NEEDED</div>
        <div class="big-num" style="color:#38bdf8;">${targetScore}</div>
      </div>
    </div>
    <div class="goal-bar-wrap">
      <div class="goal-bar-fill" style="width:${pct}%; background:${passed ? '#4ade80' : '#facc15'};"></div>
    </div>
    <div style="text-align:center;">${stampHTML}</div>
  `;
}

function updateTopDoOverButton() {
  const doOverBtn = document.getElementById('btn-manual-doover');
  if (GameState.isDoOverAttempt) {
    doOverBtn.textContent = '⚠️ 2ND RUN!';
    doOverBtn.className = 'mini-hud-btn used';
  } else if (GameState.doOverAvailable) {
    doOverBtn.textContent = '❤️ 1 DO-OVER';
    doOverBtn.className = 'mini-hud-btn danger';
  } else {
    doOverBtn.textContent = '💔 USED';
    doOverBtn.className = 'mini-hud-btn used';
  }
}

function startActiveRun(isDoOver) {
  clearAllTouchInputs();
  GameState.isDoOverAttempt = isDoOver;
  if (isDoOver) {
    GameState.doOverAvailable = false; // Consumed for the entire multi-round session!
  }

  document.getElementById('screen-setup').classList.add('hidden');
  document.getElementById('screen-run1-decision').classList.add('hidden');
  document.getElementById('screen-round-end').classList.add('hidden');

  const topActions = document.getElementById('hud-top-actions');
  topActions.classList.remove('hidden');
  updateTopDoOverButton();

  if (!phaserGame) {
    phaserGame = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'phaser-container',
      width: 1280,
      height: 720,
      pixelArt: true,
      backgroundColor: '#090d16',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 1140 },
          debug: false
        }
      },
      scene: [BeastmasterScene]
    });
  } else {
    phaserGame.scene.start('BeastmasterScene');
  }
}

window.onRunEnded = function (result) {
  clearAllTouchInputs();
  document.getElementById('hud-top-actions').classList.add('hidden');
  const targetScore = GameState.round === 1 ? 70 : (85 + (GameState.round - 1) * 20);

  // If this was Attempt 1 AND the player still has their single session Do-Over available:
  if (!GameState.isDoOverAttempt && GameState.doOverAvailable) {
    GameState.run1Data = result;
    const modal = document.getElementById('screen-run1-decision');
    const titleEl = document.getElementById('decision-title');
    const subEl = document.getElementById('decision-subtitle');
    const lockBtn = document.getElementById('btn-lock-run1');

    if (result.completed) {
      titleEl.textContent = 'RUN 1 DONE!';
      titleEl.style.color = '#4ade80';
      subEl.textContent = '❤️ 1 DO-OVER LEFT';
      lockBtn.classList.remove('hidden');
    } else {
      titleEl.textContent = 'SPLASH!';
      titleEl.style.color = '#38bdf8';
      subEl.textContent = '❤️ USE YOUR 1 DO-OVER!';
      lockBtn.classList.add('hidden');
    }

    document.getElementById('decision-score-table').innerHTML = buildScoreTableHTML(result);
    document.getElementById('decision-compare-box').innerHTML = buildCompareHTML(result, targetScore);
    modal.classList.remove('hidden');
  } else {
    GameState.finalRunData = result;
    showFinalRoundSummary(result, GameState.isDoOverAttempt);
  }
};

function showFinalRoundSummary(result) {
  clearAllTouchInputs();
  document.getElementById('screen-run1-decision').classList.add('hidden');
  const modal = document.getElementById('screen-round-end');
  const targetScore = GameState.round === 1 ? 70 : (85 + (GameState.round - 1) * 20);
  const passed = result.completed && result.total >= targetScore;

  GameState.totalTournamentScore += result.total;

  if (result.total > 0) {
    GameState.leaderboard.push({
      athlete: GameState.selectedAthlete.name,
      country: GameState.selectedCountry.code,
      round: GameState.round,
      score: result.total
    });
    GameState.leaderboard.sort((a, b) => b.score - a.score);
    GameState.leaderboard = GameState.leaderboard.slice(0, 5);
    saveLeaderboard(GameState.leaderboard);
  }

  const lbEl = document.getElementById('family-leaderboard-list');
  if (GameState.leaderboard.length === 0) {
    lbEl.innerHTML = `<div style="color:#64748b;">NO SCORES YET</div>`;
  } else {
    lbEl.innerHTML = GameState.leaderboard.map((entry, idx) =>
      `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #1e293b; padding:3px 0;">
        <span>#${idx + 1} ${entry.athlete} (${entry.country}) R${entry.round}</span>
        <span style="color:#facc15;">${entry.score} PTS</span>
      </div>`
    ).join('');
  }

  document.getElementById('round-end-title').textContent = passed
    ? `ROUND ${GameState.round} CLEARED!`
    : `GAME OVER!`;
  document.getElementById('round-end-title').style.color = passed ? '#4ade80' : '#f87171';

  const doOverStatus = GameState.doOverAvailable ? '❤️ 1 DO-OVER LEFT' : '💔 NO DO-OVERS';

  document.getElementById('round-end-badge').textContent =
    `${GameState.selectedCountry.code} • ${GameState.selectedAthlete.name} • ${doOverStatus}`;

  document.getElementById('final-score-table').innerHTML = buildScoreTableHTML(result);
  document.getElementById('round-verdict-box').innerHTML = buildCompareHTML(result, targetScore);

  if (passed) {
    document.getElementById('btn-next-round').classList.remove('hidden');
  } else {
    document.getElementById('btn-next-round').classList.add('hidden');
  }

  modal.classList.remove('hidden');
}

// Wire up all DOM buttons & Tactile Pointer Controls
window.addEventListener('DOMContentLoaded', () => {
  initSetupUI();

  document.getElementById('btn-start-run').addEventListener('click', () => {
    SFX.ensureContext();
    SFX.triangleHit();
    GameState.round = 1;
    GameState.totalTournamentScore = 0;
    GameState.doOverAvailable = true;
    GameState.run1Data = null;
    startActiveRun(false);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('screen-setup').classList.contains('hidden')) {
      document.getElementById('btn-start-run').click();
    }
  });

  document.getElementById('btn-lock-run1').addEventListener('click', () => {
    SFX.buzzer();
    showFinalRoundSummary(GameState.run1Data);
  });

  document.getElementById('btn-take-doover').addEventListener('click', () => {
    SFX.doOverWarning();
    startActiveRun(true);
  });

  document.getElementById('btn-manual-doover').addEventListener('click', () => {
    if (!GameState.isDoOverAttempt && GameState.doOverAvailable) {
      SFX.doOverWarning();
      startActiveRun(true);
    }
  });

  document.getElementById('btn-next-round').addEventListener('click', () => {
    SFX.triangleHit();
    GameState.round++;
    GameState.run1Data = null;
    startActiveRun(false);
  });

  document.getElementById('btn-restart-campaign').addEventListener('click', () => {
    SFX.tactileClick();
    clearAllTouchInputs();
    GameState.round = 1;
    GameState.totalTournamentScore = 0;
    GameState.doOverAvailable = true;
    GameState.isDoOverAttempt = false;
    GameState.run1Data = null;
    document.getElementById('setup-round-badge').textContent = 'ROUND 1 • GOAL: 70 PTS';
    document.getElementById('screen-round-end').classList.add('hidden');
    document.getElementById('screen-setup').classList.remove('hidden');
  });

  document.getElementById('btn-mute-toggle').addEventListener('click', (e) => {
    const muted = SFX.toggleMute();
    e.target.textContent = muted ? 'SFX: OFF' : 'SFX: ON';
  });

  // Multi-touch Pointer Event Binding for Mobile Buttons (snappy, tactile & anti-stuck)
  const bindTactileButton = (id, key, isJump = false) => {
    const el = document.getElementById(id);
    let activePointerId = null;

    const press = (e) => {
      e.preventDefault();
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}

      SFX.ensureContext();
      SFX.tactileClick();
      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (_) {}
      }

      el.classList.add('pressed');
      if (isJump) {
        TouchInput.jumpHeld = true;
        TouchInput.jumpJustPressed = true;
      } else {
        TouchInput[key] = true;
      }
    };

    const release = (e) => {
      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      activePointerId = null;
      el.classList.remove('pressed');
      if (isJump) {
        TouchInput.jumpHeld = false;
      } else {
        TouchInput[key] = false;
      }
    };

    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
  };

  bindTactileButton('touch-left', 'left', false);
  bindTactileButton('touch-right', 'right', false);
  bindTactileButton('touch-jump', null, true);
});
</script>
