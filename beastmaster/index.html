<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Charlie's Beastmaster Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090b12;
      color: #f8fafc;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #141a29 0%, #07090f 100%);
      overflow: hidden;
    }
    #phaser-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #phaser-container canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.18), 0 0 0 3px #273043;
      border-radius: 6px;
    }

    /* Overlay Screens */
    .ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 10, 18, 0.86);
      backdrop-filter: blur(4px);
      z-index: 30;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .hidden {
      display: none !important;
    }

    .pixel-panel {
      background: #131926;
      border: 4px solid #3c4a64;
      box-shadow: inset 0 0 0 4px #0c1018, 0 12px 32px rgba(0,0,0,0.85);
      border-radius: 10px;
      padding: 18px 22px;
      max-width: 920px;
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .title-banner {
      text-align: center;
      margin-bottom: 14px;
    }
    .title-banner h1 {
      font-size: clamp(15px, 2.6vw, 26px);
      color: #ff9f1c;
      text-shadow: 3px 3px 0 #7c2d12, 0 0 18px rgba(255, 159, 28, 0.5);
      margin: 0 0 8px 0;
      line-height: 1.3;
    }
    .subtitle-tag {
      display: inline-block;
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-size: clamp(9px, 1.3vw, 11px);
      padding: 6px 12px;
      border-radius: 6px;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    @media (max-width: 760px) {
      .setup-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-box {
      background: #0d121c;
      border: 3px solid #2b364c;
      border-radius: 8px;
      padding: 12px;
    }
    .section-title {
      font-size: 10px;
      color: #38bdf8;
      margin: 0 0 10px 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Country Grid */
    .country-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .country-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #182030;
      border: 3px solid #2e3b52;
      color: #e2e8f0;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      transition: transform 0.08s, border-color 0.12s, background 0.12s;
      text-align: left;
    }
    .country-btn:hover {
      background: #212c42;
      border-color: #64748b;
    }
    .country-btn.selected {
      background: #1d3557;
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
      color: #ffffff;
    }
    .flag-canvas {
      width: 28px;
      height: 18px;
      image-rendering: pixelated;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    /* Athlete Grid */
    .athlete-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    @media (max-width: 480px) {
      .athlete-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .athlete-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #182030;
      border: 3px solid #2e3b52;
      color: #e2e8f0;
      padding: 12px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      transition: transform 0.08s, border-color 0.12s;
    }
    .athlete-btn:hover {
      background: #212c42;
    }
    .athlete-btn.selected {
      background: #1a2e26;
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
    .portrait-canvas {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
      background: #0a0e17;
      border: 2px solid #475569;
    }

    /* Quick Visual Legend */
    .quick-legend {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      background: #101622;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 9px;
      color: #e2e8f0;
      margin-bottom: 14px;
      text-align: center;
    }
    .rules-strip {
      background: #101622;
      border: 2px solid #334155;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 9px;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .hl-yellow { color: #facc15; }
    .hl-cyan { color: #38bdf8; }
    .hl-red { color: #f87171; }
    .hl-green { color: #4ade80; }

    /* Visual Score Comparison Card for Kids */
    .big-compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0;
    }
    .compare-card {
      background: #0d121c;
      border: 3px solid #334155;
      border-radius: 8px;
      padding: 12px 10px;
      text-align: center;
    }
    .compare-card .label {
      font-size: 9px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .compare-card .big-num {
      font-size: clamp(18px, 3vw, 24px);
      color: #facc15;
    }
    .goal-bar-wrap {
      width: 100%;
      height: 18px;
      background: #090d16;
      border: 2px solid #475569;
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
    }
    .goal-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #4ade80);
      transition: width 0.35s ease-out;
    }
    .stamp-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
    }
    .stamp-pass {
      background: #14532d;
      border: 2px solid #4ade80;
      color: #4ade80;
    }
    .stamp-fail {
      background: #450a0a;
      border: 2px solid #f87171;
      color: #fca5a5;
    }

    /* Arcade Buttons */
    .arcade-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 1.5vw, 14px);
      padding: 14px 24px;
      border-radius: 8px;
      border: 3px solid #fff;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.08s, filter 0.12s;
      box-shadow: 0 5px 0 #090d16;
    }
    .arcade-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #090d16;
    }
    .arcade-btn:hover {
      filter: brightness(1.1);
    }
    .btn-green {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border-color: #86efac;
      color: #ffffff;
      text-shadow: 2px 2px 0 #052e16;
    }
    .btn-amber {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      border-color: #fde68a;
      color: #ffffff;
      text-shadow: 2px 2px 0 #451a03;
    }
    .btn-cyan {
      background: linear-gradient(180deg, #06b6d4 0%, #0e7490 100%);
      border-color: #a5f3fc;
      color: #ffffff;
      text-shadow: 2px 2px 0 #083344;
    }

    /* Scoreboard Rows */
    .score-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 9px;
    }
    .score-table td {
      padding: 8px 10px;
      border-bottom: 2px solid #1e293b;
    }
    .score-table td:last-child {
      text-align: right;
      color: #facc15;
    }

    /* Tactile Safe-Area Mobile Controls (iPad & Android friendly) */
    #touch-controls {
      position: fixed;
      left: max(20px, env(safe-area-inset-left, 20px));
      right: max(20px, env(safe-area-inset-right, 20px));
      bottom: calc(38px + env(safe-area-inset-bottom, 18px));
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 25;
    }
    @media (pointer: coarse), (max-width: 1024px) {
      #touch-controls {
        display: flex;
      }
    }
    .touch-cluster {
      display: flex;
      gap: 16px;
      pointer-events: auto;
      align-items: center;
    }
    .touch-btn {
      min-width: 78px;
      height: 78px;
      padding: 0 16px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.88) 0%, rgba(15, 23, 42, 0.94) 100%);
      border: 3px solid rgba(56, 189, 248, 0.85);
      border-radius: 16px;
      color: #f8fafc;
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 rgba(7, 11, 20, 0.95), 0 8px 18px rgba(0, 0, 0, 0.6);
      touch-action: none;
      transition: transform 0.05s ease-out, box-shadow 0.05s ease-out, background 0.06s ease-out, border-color 0.06s ease-out;
      cursor: pointer;
    }
    .touch-btn.jump-action {
      min-width: 128px;
      height: 84px;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      border-color: rgba(74, 222, 128, 0.9);
      background: linear-gradient(180deg, rgba(22, 101, 52, 0.88) 0%, rgba(15, 23, 42, 0.94) 100%);
    }
    .touch-btn.pressed {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 2px 0 rgba(7, 11, 20, 0.95), 0 0 18px rgba(56, 189, 248, 0.7);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.65) 0%, rgba(2, 132, 199, 0.85) 100%);
      border-color: #ffffff;
      color: #ffffff;
    }
    .touch-btn.jump-action.pressed {
      box-shadow: 0 2px 0 rgba(7, 11, 20, 0.95), 0 0 20px rgba(74, 222, 128, 0.8);
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.75) 0%, rgba(21, 128, 61, 0.9) 100%);
    }

    /* Top Right Quick Audio / Do-Over Floating Controls */
    #hud-top-actions {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: max(14px, env(safe-area-inset-right, 14px));
      display: flex;
      gap: 8px;
      z-index: 26;
    }
    .mini-hud-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #475569;
      color: #e2e8f0;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mini-hud-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .mini-hud-btn.danger {
      border-color: #f59e0b;
      color: #fbbf24;
    }
    .mini-hud-btn.danger:hover {
      background: rgba(180, 83, 9, 0.35);
    }
    .mini-hud-btn.used {
      border-color: #475569;
      color: #64748b;
      cursor: default;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="phaser-container"></div>

    <!-- Floating Quick Controls during active run -->
    <div id="hud-top-actions" class="hidden">
      <button id="btn-manual-doover" class="mini-hud-btn danger" title="1 Do-Over per run">❤️ 1 DO-OVER</button>
      <button id="btn-mute-toggle" class="mini-hud-btn">SFX: ON</button>
    </div>

    <!-- Mobile Touch Pad (Positioned safely above iPad/Android bottom bars) -->
    <div id="touch-controls">
      <div class="touch-cluster">
        <button class="touch-btn" id="touch-left" aria-label="Move Left">◀</button>
        <button class="touch-btn" id="touch-right" aria-label="Move Right">▶</button>
      </div>
      <div class="touch-cluster">
        <button class="touch-btn jump-action" id="touch-jump" aria-label="Jump or Climb">JUMP /<br/>CLIME</button>
      </div>
    </div>

    <!-- PRE-RUN SETUP / CHARACTER & COUNTRY SELECT -->
    <div id="screen-setup" class="ui-overlay">
      <div class="pixel-panel">
        <div class="title-banner">
          <h1>CHARLIE'S BEASTMASTER GAME</h1>
          <div class="subtitle-tag" id="setup-round-badge">ROUND 1 • GOAL: 70 PTS</div>
        </div>

        <div class="setup-grid">
          <!-- Country Select -->
          <div class="section-box">
            <div class="section-title">
              <span>1. TEAM</span>
              <span id="selected-country-code" style="color:#4ade80;">AUS</span>
            </div>
            <div class="country-grid" id="country-grid"></div>
          </div>

          <!-- Character Select -->
          <div class="section-box">
            <div class="section-title">
              <span>2. PLAYER</span>
              <span id="selected-athlete-name" style="color:#4ade80;">CHARLIE</span>
            </div>
            <div class="athlete-grid" id="athlete-grid"></div>
          </div>
        </div>

        <div class="quick-legend">
          <div>🔺 <span class="hl-cyan">+5 PTS</span></div>
          <div>⚡ <span class="hl-yellow">THRUSTER = SPEED PTS</span></div>
          <div>❤️ <span class="hl-red">1 DO-OVER TOTAL</span></div>
        </div>

        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
          <button id="btn-start-run" class="arcade-btn btn-green">PLAY ▶</button>
        </div>
      </div>
    </div>

    <!-- MID-ROUND DECISION MODAL (Shown when 1 Session Do-Over is available) -->
    <div id="screen-run1-decision" class="ui-overlay hidden">
      <div class="pixel-panel" style="max-width: 620px;">
        <div class="title-banner">
          <h1 id="decision-title" style="color:#38bdf8;">RUN 1 DONE!</h1>
          <div class="subtitle-tag" id="decision-subtitle">❤️ 1 DO-OVER LEFT</div>
        </div>

        <table class="score-table" id="decision-score-table"></table>

        <div id="decision-compare-box"></div>

        <div class="rules-strip" style="border-color:#f59e0b; background:#1c140d; text-align:center;">
          ⚠️ <span class="hl-red">2ND RUN COUNTS NO MATTER WHAT!</span>
        </div>

        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:12px;">
          <button id="btn-lock-run1" class="arcade-btn btn-green">KEEP SCORE ✔</button>
          <button id="btn-take-doover" class="arcade-btn btn-amber">🔄 DO-OVER (1 LEFT)</button>
        </div>
      </div>
    </div>

    <!-- FINAL ROUND SUMMARY MODAL -->
    <div id="screen-round-end" class="ui-overlay hidden">
      <div class="pixel-panel" style="max-width: 620px;">
        <div class="title-banner">
          <h1 id="round-end-title">ROUND 1</h1>
          <div class="subtitle-tag" id="round-end-badge">AUS • CHARLIE</div>
        </div>

        <table class="score-table" id="final-score-table"></table>

        <div id="round-verdict-box" style="margin: 8px 0;"></div>

        <div id="family-leaderboard-box" class="section-box" style="margin-top:10px; padding:10px 12px;">
          <div class="section-title" style="margin-bottom:8px;">
            <span>🏆 TOP SCORES</span>
          </div>
          <div id="family-leaderboard-list" style="font-size:8px; line-height:1.9; color:#cbd5e1;"></div>
        </div>

        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:14px;">
          <button id="btn-next-round" class="arcade-btn btn-green">➡️ NEXT ROUND</button>
          <button id="btn-restart-campaign" class="arcade-btn btn-cyan">🔁 NEW RUN</button>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * ============================================================================
 * CHARLIE'S BEASTMASTER GAME
 * Built with Phaser 3 + Procedural 16-bit Pixel Art + Web Audio Chiptune Synth
 * ============================================================================
 */

// ----------------------------------------------------------------------------
// 1. RETRO WEB AUDIO SYNTHESIZER
// ----------------------------------------------------------------------------
class RetroAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }

  playTone(freq, endFreq, duration, type = 'square', gainVal = 0.14, delay = 0) {
    if (this.muted) return;
    this.ensureContext();
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq !== freq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
    }
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  playNoise(duration, gainVal = 0.18, filterFreq = 900) {
    if (this.muted) return;
    this.ensureContext();
    const now = this.ctx.currentTime;
    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterFreq, now);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  tactileClick() {
    this.playTone(320, 180, 0.032, 'triangle', 0.08);
  }

  jump() {
    this.playTone(210, 520, 0.14, 'square', 0.11);
  }

  springBounce() {
    this.playTone(160, 760, 0.24, 'sawtooth', 0.15);
    this.playTone(320, 940, 0.20, 'square', 0.09, 0.04);
  }

  triangleHit() {
    this.playTone(660, 660, 0.07, 'square', 0.12, 0);
    this.playTone(990, 1320, 0.14, 'triangle', 0.15, 0.06);
  }

  megaThruster() {
    this.playNoise(0.38, 0.22, 1400);
    this.playTone(220, 440, 0.12, 'sawtooth', 0.16, 0);
    this.playTone(330, 660, 0.14, 'sawtooth', 0.16, 0.09);
    this.playTone(550, 1100, 0.25, 'square', 0.18, 0.18);
  }

  splash() {
    this.playNoise(0.55, 0.28, 650);
    this.playTone(240, 65, 0.42, 'sawtooth', 0.16);
  }

  buzzer() {
    this.playTone(140, 135, 0.35, 'sawtooth', 0.2, 0);
    this.playTone(523.25, 523.25, 0.12, 'square', 0.14, 0.18);
    this.playTone(659.25, 659.25, 0.12, 'square', 0.14, 0.30);
    this.playTone(783.99, 783.99, 0.12, 'square', 0.14, 0.42);
    this.playTone(1046.5, 1046.5, 0.32, 'square', 0.18, 0.54);
  }

  doOverWarning() {
    this.playTone(440, 311, 0.16, 'sawtooth', 0.15, 0);
    this.playTone(311, 220, 0.24, 'sawtooth', 0.15, 0.16);
  }
}

const SFX = new RetroAudio();

// ----------------------------------------------------------------------------
// 2. COUNTRIES & FAMILY ATHLETE ROSTER DATA
// ----------------------------------------------------------------------------
const COUNTRIES = [
  { code: 'AUS', name: 'AUSTRALIA', primary: '#15803d', secondary: '#facc15', flagType: 'aus' },
  { code: 'USA', name: 'USA',       primary: '#1d4ed8', secondary: '#ef4444', flagType: 'usa' },
  { code: 'JPN', name: 'JAPAN',     primary: '#f8fafc', secondary: '#dc2626', flagType: 'jpn' },

const LEADERBOARD_STORAGE_KEY = 'charlies_beastmaster_leaderboard_v3';

function loadSavedLeaderboard() {
  try {
    const raw = localStorage.getItem(LEADERBOARD_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return [];
}

function saveLeaderboard(entries) {
  try {
    localStorage.setItem(LEADERBOARD_STORAGE_KEY, JSON.stringify(entries.slice(0, 10)));
  } catch (e) {}
}

// Render mini pixel flag onto any canvas
function drawPixelFlag(canvas, flagType) {
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  if (flagType === 'aus') {
    ctx.fillStyle = '#00247d';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 2, 7, 2);
    ctx.fillRect(3, 0, 2, 6);
    ctx.fillStyle = '#cf142b';
    ctx.fillRect(0, 2.5, 7, 1);
    ctx.fillRect(3.5, 0, 1, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(3, 8, 2, 2);
    ctx.fillRect(10, 3, 1, 1);
    ctx.fillRect(12, 5, 1, 1);
    ctx.fillRect(9, 6, 1, 1);
    ctx.fillRect(11, 8, 1, 1);
  } else if (flagType === 'usa') {
    for (let y = 0; y < h; y++) {
      ctx.fillStyle = y % 2 === 0 ? '#dc2626' : '#ffffff';
      ctx.fillRect(0, y, w, 1);
    }
    ctx.fillStyle = '#1e3a8a';
    ctx.fillRect(0, 0, 7, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(1, 1, 1, 1);
    ctx.fillRect(4, 2, 1, 1);
    ctx.fillRect(2, 4, 1, 1);
  } else if (flagType === 'jpn') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  } else if (flagType === 'gbr') {
    ctx.fillStyle = '#012169';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 4, w, 3);
    ctx.fillRect(6, 0, 3, h);
    ctx.fillStyle = '#c8102e';
    ctx.fillRect(0, 5, w, 1);
    ctx.fillRect(7, 0, 1, h);
  } else if (flagType === 'bra') {
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(w / 2, 1);
    ctx.lineTo(w - 2, h / 2);
    ctx.lineTo(w / 2, h - 1);
    ctx.lineTo(2, h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(w / 2 - 2, h / 2 - 2, 4, 4);
  } else if (flagType === 'ger') {
    ctx.fillStyle = '#09090b';
    ctx.fillRect(0, 0, w, 4);
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(0, 4, w, 4);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(0, 8, w, 4);
  } else if (flagType === 'can') {
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(0, 0, 4, h);
    ctx.fillRect(w - 4, 0, 4, h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(4, 0, w - 8, h);
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(6, 4, 4, 3);
    ctx.fillRect(7, 3, 2, 6);
  } else if (flagType === 'kor') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(6, 3, 4, 3);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(6, 6, 4, 3);
    ctx.fillStyle = '#09090b';
    ctx.fillRect(2, 2, 2, 2);
    ctx.fillRect(12, 2, 2, 2);
    ctx.fillRect(2, 8, 2, 2);
    ctx.fillRect(12, 8, 2, 2);
  }
}

// Render 16x16 pixel portrait for Character Select screen
function drawAthletePortrait(canvas, athlete, country) {
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 16, 16);

  if (athlete.type === 'dog') {
    ctx.fillStyle = country.primary;
    ctx.fillRect(3, 12, 10, 4);
    ctx.fillStyle = country.secondary;
    ctx.fillRect(6, 13, 4, 3);

    ctx.fillStyle = athlete.coatBlack;
    ctx.fillRect(4, 3, 8, 7);

    // Long feathered floppy ears
    ctx.fillStyle = athlete.coatBlack;
    ctx.fillRect(2, 4, 2, 8);
    ctx.fillRect(12, 4, 2, 8);
    ctx.fillStyle = athlete.coatTan;
    ctx.fillRect(2, 9, 2, 3);
    ctx.fillRect(12, 9, 2, 3);

    // Tan eyebrows & muzzle
    ctx.fillStyle = athlete.coatTan;
    ctx.fillRect(5, 5, 2, 1);
    ctx.fillRect(9, 5, 2, 1);
    ctx.fillRect(5, 8, 6, 4);

    // Eyes & nose
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(5, 6, 2, 2);
    ctx.fillRect(9, 6, 2, 2);
    ctx.fillStyle = '#090d16';
    ctx.fillRect(6, 6, 1, 2);
    ctx.fillRect(9, 6, 1, 2);
    ctx.fillRect(7, 9, 2, 2);
    return;
  }

  ctx.fillStyle = country.primary;
  ctx.fillRect(3, 12, 10, 4);
  ctx.fillStyle = country.secondary;
  ctx.fillRect(6, 12, 4, 4);

  ctx.fillStyle = athlete.skin;
  ctx.fillRect(6, 10, 4, 2);
  ctx.fillRect(4, 3, 8, 8);

  ctx.fillStyle = athlete.hair;
  ctx.fillRect(4, 2, 8, 2);
  if (athlete.hairStyle === 'spiky') {
    ctx.fillRect(4, 1, 2, 1);
    ctx.fillRect(7, 0, 2, 2);
    ctx.fillRect(10, 1, 2, 1);
  } else if (athlete.hairStyle === 'pigtails') {
    ctx.fillRect(2, 3, 2, 4);
    ctx.fillRect(12, 3, 2, 4);
    ctx.fillStyle = country.secondary;
    ctx.fillRect(2, 3, 2, 1);
    ctx.fillRect(12, 3, 2, 1);
  } else if (athlete.hairStyle === 'curly') {
    ctx.fillRect(5, 1, 6, 2);
    ctx.fillRect(3, 2, 10, 2);
  } else if (athlete.hairStyle === 'ponytail') {
    ctx.fillRect(3, 3, 1, 6);
    ctx.fillRect(12, 3, 1, 6);
    ctx.fillRect(12, 1, 2, 3);
  }

  if (athlete.headband) {
    ctx.fillStyle = country.secondary;
    ctx.fillRect(4, 4, 8, 1);
  }

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(5, 6, 2, 2);
  ctx.fillRect(9, 6, 2, 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(5, 6, 1, 1);
  ctx.fillRect(9, 6, 1, 1);

  if (athlete.beard) {
    ctx.fillStyle = athlete.hair;
    ctx.fillRect(4, 9, 8, 2);
    ctx.fillRect(6, 8, 4, 1);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(7, 9, 2, 1);
}

// ----------------------------------------------------------------------------
// 3. PROCEDURAL PIXEL-ART TEXTURE GENERATOR FOR PHASER
// ----------------------------------------------------------------------------
function generatePixelTextures(scene, athlete, country) {
  const makeTex = (key, w, h, drawFn) => {
    if (scene.textures.exists(key)) {
      scene.textures.remove(key);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    drawFn(ctx, w, h);
    scene.textures.addCanvas(key, canvas);
  };

  // A1. Quadruped Long-Haired Dachshund Sprites for Frankie (24x16 pixel art)
  const drawDachshund = (frame) => (ctx) => {
    const black = athlete.coatBlack;
    const tan = athlete.coatTan;
    const hi = athlete.furHighlight;

    // Wagging feathered tail
    ctx.fillStyle = black;
    if (frame === 'run1' || frame === 'jump') {
      ctx.fillRect(0, 4, 3, 2);
      ctx.fillRect(2, 5, 2, 2);
    } else {
      ctx.fillRect(0, 6, 3, 2);
      ctx.fillRect(2, 6, 2, 2);
    }
    ctx.fillStyle = tan;
    ctx.fillRect(0, frame === 'run1' ? 5 : 7, 2, 1);

    // Long torso
    ctx.fillStyle = black;
    ctx.fillRect(4, 6, 13, 5);
    ctx.fillStyle = hi;
    ctx.fillRect(5, 11, 11, 1);
    ctx.fillStyle = tan;
    ctx.fillRect(14, 8, 3, 3);

    // Miniature Country Team Vest
    ctx.fillStyle = country.primary;
    ctx.fillRect(9, 6, 5, 5);
    ctx.fillStyle = country.secondary;
    ctx.fillRect(11, 6, 2, 5);

    // Head & Snout
    ctx.fillStyle = black;
    ctx.fillRect(15, 2, 6, 6);
    ctx.fillStyle = tan;
    ctx.fillRect(20, 5, 4, 3);
    ctx.fillStyle = '#090d16';
    ctx.fillRect(23, 5, 1, 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(18, 3, 1, 1);

    // Floppy feathered ear
    ctx.fillStyle = black;
    ctx.fillRect(15, 4, 3, 5);
    ctx.fillStyle = tan;
    ctx.fillRect(15, 8, 3, 2);

    // 4 Short Paws
    ctx.fillStyle = tan;
    if (frame === 'idle') {
      ctx.fillRect(5, 12, 2, 3);
      ctx.fillRect(8, 12, 2, 3);
      ctx.fillRect(13, 12, 2, 3);
      ctx.fillRect(16, 12, 2, 3);
    } else if (frame === 'run1') {
      ctx.fillRect(3, 12, 2, 3);
      ctx.fillRect(7, 11, 2, 3);
      ctx.fillRect(14, 11, 2, 3);
      ctx.fillRect(18, 12, 2, 3);
    } else if (frame === 'run2') {
      ctx.fillRect(6, 12, 2, 3);
      ctx.fillRect(9, 12, 2, 3);
      ctx.fillRect(12, 12, 2, 3);
      ctx.fillRect(15, 12, 2, 3);
    } else if (frame === 'jump') {
      ctx.fillRect(2, 11, 3, 2);
      ctx.fillRect(6, 12, 2, 2);
      ctx.fillRect(15, 12, 2, 2);
      ctx.fillRect(18, 10, 3, 2);
    } else if (frame === 'climb') {
      ctx.fillRect(4, 10, 2, 4);
      ctx.fillRect(8, 12, 2, 3);
      ctx.fillRect(13, 10, 2, 4);
      ctx.fillRect(17, 12, 2, 3);
    }
  };

  // A2. Human Athlete Sprites (16x24 pixel art)
  const drawRunner = (frame) => (ctx) => {
    ctx.fillStyle = athlete.hair;
    ctx.fillRect(5, 1, 6, 3);
    if (athlete.hairStyle === 'spiky') {
      ctx.fillRect(5, 0, 2, 1);
      ctx.fillRect(9, 0, 2, 1);
    } else if (athlete.hairStyle === 'pigtails') {
      ctx.fillRect(3, 2, 2, 4);
      ctx.fillRect(11, 2, 2, 4);
    } else if (athlete.hairStyle === 'curly') {
      ctx.fillRect(4, 0, 8, 2);
    } else if (athlete.hairStyle === 'ponytail') {
      ctx.fillRect(3, 2, 2, 5);
    }

    ctx.fillStyle = athlete.skin;
    ctx.fillRect(5, 3, 6, 5);

    if (athlete.headband) {
      ctx.fillStyle = country.secondary;
      ctx.fillRect(5, 3, 6, 1);
    }

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(9, 4, 1, 2);
    if (athlete.beard) {
      ctx.fillStyle = athlete.hair;
      ctx.fillRect(6, 7, 5, 1);
    }

    ctx.fillStyle = country.primary;
    ctx.fillRect(5, 8, 6, 6);
    ctx.fillStyle = country.secondary;
    ctx.fillRect(7, 8, 2, 6);

    ctx.fillStyle = athlete.skin;
    if (frame === 'idle') {
      ctx.fillRect(4, 9, 1, 5);
      ctx.fillRect(11, 9, 1, 5);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(5, 14, 6, 3);
      ctx.fillStyle = athlete.skin;
      ctx.fillRect(5, 17, 2, 4);
      ctx.fillRect(9, 17, 2, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(5, 21, 3, 2);
      ctx.fillRect(9, 21, 3, 2);
    } else if (frame === 'run1') {
      ctx.fillRect(3, 8, 2, 4);
      ctx.fillRect(11, 10, 2, 4);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(5, 14, 6, 3);
      ctx.fillStyle = athlete.skin;
      ctx.fillRect(3, 17, 3, 4);
      ctx.fillRect(10, 16, 3, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(2, 21, 3, 2);
      ctx.fillRect(11, 20, 3, 2);
    } else if (frame === 'run2') {
      ctx.fillRect(11, 8, 2, 4);
      ctx.fillRect(3, 10, 2, 4);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(5, 14, 6, 3);
      ctx.fillStyle = athlete.skin;
      ctx.fillRect(9, 17, 3, 4);
      ctx.fillRect(4, 16, 3, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(10, 21, 3, 2);
      ctx.fillRect(3, 20, 3, 2);
    } else if (frame === 'jump') {
      ctx.fillRect(3, 5, 2, 4);
      ctx.fillRect(11, 6, 2, 4);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(5, 14, 6, 3);
      ctx.fillStyle = athlete.skin;
      ctx.fillRect(4, 16, 3, 3);
      ctx.fillRect(9, 17, 3, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(3, 19, 3, 2);
      ctx.fillRect(10, 21, 3, 2);
    } else if (frame === 'climb') {
      ctx.fillRect(3, 4, 2, 5);
      ctx.fillRect(11, 7, 2, 5);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(5, 14, 6, 3);
      ctx.fillStyle = athlete.skin;
      ctx.fillRect(4, 17, 2, 4);
      ctx.fillRect(10, 15, 2, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(4, 21, 2, 2);
      ctx.fillRect(10, 19, 2, 2);
    }
  };

  if (athlete.type === 'dog') {
    makeTex('player_idle', 24, 16, drawDachshund('idle'));
    makeTex('player_run1', 24, 16, drawDachshund('run1'));
    makeTex('player_run2', 24, 16, drawDachshund('run2'));
    makeTex('player_jump', 24, 16, drawDachshund('jump'));
    makeTex('player_climb', 24, 16, drawDachshund('climb'));
  } else {
    makeTex('player_idle', 16, 24, drawRunner('idle'));
    makeTex('player_run1', 16, 24, drawRunner('run1'));
    makeTex('player_run2', 16, 24, drawRunner('run2'));
    makeTex('player_jump', 16, 24, drawRunner('jump'));
    makeTex('player_climb', 16, 24, drawRunner('climb'));
  }

  // B. Industrial Platform Tile (32x32)
  makeTex('plat_industrial', 32, 32, (ctx) => {
    ctx.fillStyle = '#334155';
    ctx.fillRect(0, 0, 32, 32);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(0, 0, 32, 4);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, 4, 32, 6);
    ctx.fillStyle = '#0f172a';
    for (let x = -8; x < 32; x += 8) {
      ctx.beginPath();
      ctx.moveTo(x, 10);
      ctx.lineTo(x + 4, 4);
      ctx.lineTo(x + 8, 4);
      ctx.lineTo(x + 4, 10);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#475569';
    ctx.fillRect(2, 12, 13, 18);
    ctx.fillRect(17, 12, 13, 18);
    ctx.fillStyle = '#7c2d12';
    ctx.fillRect(3, 24, 6, 5);
    ctx.fillRect(22, 14, 5, 4);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(3, 13, 1, 1);
    ctx.fillRect(13, 13, 1, 1);
    ctx.fillRect(18, 13, 1, 1);
    ctx.fillRect(28, 13, 1, 1);
  });

  // C. Tilted "CHRAMP" Spring Pad (48x48)
  makeTex('chramp_pad', 48, 48, (ctx) => {
    ctx.fillStyle = '#475569';
    ctx.fillRect(4, 4, 40, 40);
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 4;
    ctx.strokeRect(4, 4, 40, 40);

    }
    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath();
    ctx.arc(24, 24, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#bef264';
    ctx.beginPath();
    ctx.arc(24, 24, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(20, 19, 4, 3);
  });

  // D. Crag Rock Block (32x32)

    ctx.fillStyle = '#5c4033';
    ctx.fillRect(0, 0, 32, 32);

    ctx.moveTo(12, 7);
    ctx.lineTo(17, 18);

    ctx.closePath();

  // I. Mega Thruster (36x36)

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(2, 4, 32, 30);
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 4, 32, 30);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(18, 19, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(18, 19, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(16, 14, 4, 2);
    ctx.fillRect(14, 17, 8, 2);
  });

  makeTex('thruster_done', 36, 36, (ctx) => {
    ctx.fillStyle = '#064e3b';
    ctx.fillRect(2, 4, 32, 30);
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 4, 32, 30);
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(18, 19, 9, 0, Math.PI * 2);
    ctx.fill();
  });

  // J. Finish Slam Buzzer (44x32)
  makeTex('finish_buzzer', 44, 32, (ctx) => {
    ctx.fillStyle = '#64748b';
    ctx.fillRect(4, 20, 36, 12);
    ctx.fillStyle = '#334155';
    ctx.fillRect(6, 24, 32, 8);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(22, 20, 14, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#f87171';
    ctx.fillRect(14, 10, 6, 4);
  });
}

// ----------------------------------------------------------------------------
// 4. MOBILE TOUCH INPUT MANAGER (Multi-touch safe + Zero Stuck Keys)
// ----------------------------------------------------------------------------
const TouchInput = {
  left: false,
  right: false,
  jumpHeld: false,
  jumpJustPressed: false
};

function clearAllTouchInputs() {
  TouchInput.left = false;
  TouchInput.right = false;
  TouchInput.jumpHeld = false;
  TouchInput.jumpJustPressed = false;
  document.querySelectorAll('.touch-btn').forEach(btn => btn.classList.remove('pressed'));
}

window.addEventListener('blur', clearAllTouchInputs);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearAllTouchInputs();
});

// ----------------------------------------------------------------------------
// 5. MAIN PHASER GAME SCENE (1280x720 16:9 Landscape Resolution)
// ----------------------------------------------------------------------------
class BeastmasterScene extends Phaser.Scene {
  constructor() {
    super('BeastmasterScene');
  }

  create() {
    const round = GameState.round;
    const diff = this.getDifficultyParams(round);

    clearAllTouchInputs();

    this.worldWidth = 4850;
    this.worldHeight = 720;
    this.waterSurfaceY = 615;

    this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight + 120);
    this.physics.world.gravity.y = 1140;

    generatePixelTextures(this, GameState.selectedAthlete, GameState.selectedCountry);

    // Run state variables
    this.runStarted = false;
    this.runFinished = false;
    this.runFailed = false;
    this.elapsedTime = 0;
    this.trianglesCollected = 0;
    this.totalTriangles = 0;
    this.thruster1Points = 0;
    this.thruster2Points = 0;
    this.boostTimer = 0;
    this.coyoteTimer = 0;
    this.jumpBufferTimer = 0;
    this.onTreadmillSpeed = 0;

    // 1. Dark Industrial Stadium Background
    this.createStadiumBackdrop();

    // 2. Build Complete Course from START (x=120) to FINISH (x=4340)
    this.staticPlatforms = this.physics.add.staticGroup();
    this.climbZones = this.physics.add.staticGroup();
    this.trianglesGroup = this.physics.add.staticGroup();
    this.thrustersGroup = this.physics.add.staticGroup();
    this.sinkingTubes = [];
    this.treadmills = [];
    this.bridgePlanks = [];
    this.springPads = [];

    this.buildCourse(diff);

    // 3. Spawn Player Safely on the START Platform (x=220, y=450)
    const athlete = GameState.selectedAthlete;
    this.player = this.physics.add.sprite(220, 445, 'player_idle');
    if (athlete.type === 'dog') {
      this.player.setScale(1.95);
      this.player.body.setSize(18, 12);
      this.player.body.setOffset(3, 3);
    } else {
      const s = 2.1 * athlete.heightScale;
      this.player.setScale(s);
      this.player.body.setSize(10, 21);
      this.player.body.setOffset(3, 3);
    }
    this.player.setCollideWorldBounds(true);
    this.player.setDepth(10);

    // Colliders & Overlaps
    this.physics.add.collider(this.player, this.staticPlatforms);

    this.springPads.forEach(pad => {
      this.physics.add.collider(this.player, pad.zone, () => this.handleSpringBounce(pad), null, this);
    });

    this.sinkingTubes.forEach(tube => {
      this.physics.add.collider(this.player, tube.bodyObj, () => {
        tube.beingSteppedOn = true;
      }, null, this);
    });

    this.treadmills.forEach(tm => {
      this.physics.add.collider(this.player, tm.platform, () => {
        if (this.player.body.touching.down) {
          this.onTreadmillSpeed = -tm.beltSpeed;
        }
      }, null, this);
    });

    this.bridgePlanks.forEach(bp => {
      this.physics.add.collider(this.player, bp.sprite, () => {
        if (this.player.body.touching.down && !bp.solidOnly) {
          bp.stepped = true;
        }
      }, null, this);
    });

    this.physics.add.overlap(this.player, this.trianglesGroup, this.collectTriangle, null, this);
    this.physics.add.overlap(this.player, this.thrustersGroup, this.activateThruster, null, this);
    this.physics.add.overlap(this.player, this.finishZone, this.completeCourse, null, this);

    // 4. Foreground Animated Water Hazard
    this.createWaterHazard(diff);

    // 5. Camera Setup
    this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
    this.cameras.main.startFollow(this.player, true, 0.14, 0.14, -220, 45);

    // 6. Fixed Screen-Space Arcade HUD
    this.createArcadeHUD(diff);

    // 7. Input Setup
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys({
      W: Phaser.Input.Keyboard.KeyCodes.W,
      A: Phaser.Input.Keyboard.KeyCodes.A,
      S: Phaser.Input.Keyboard.KeyCodes.S,
      D: Phaser.Input.Keyboard.KeyCodes.D,
      SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE
    });

    const bannerText = GameState.isDoOverAttempt
      ? `ROUND ${round} — DO-OVER RUN! COUNTS!`
      : `ROUND ${round} — GOAL: ${diff.targetScore} PTS!`;

    this.showFloatingBanner(
      bannerText,
      GameState.isDoOverAttempt ? '#f59e0b' : '#4ade80'
    );
    this.runStarted = true;
  }

  getDifficultyParams(round) {
    const r = Math.min(round - 1, 6);
    if (round === 1) {
      return {
        isRound1: true,
        treadmillSpeed: 68,
        tubeSinkSpeed: 20,
        bridgeSolid: true,
        bridgeDropDelay: 99,
        waterWaveAmp: 5,
        targetScore: 70,
        thrusterMultiplier: 2.2
      };
    }
    return {
      isRound1: false,
      treadmillSpeed: 112 + (r - 1) * 28,
      tubeSinkSpeed: 40 + (r - 1) * 14,
      bridgeSolid: false,
      bridgeDropDelay: Math.max(0.24, 0.58 - (r - 1) * 0.07),
      waterWaveAmp: 6.5 + (r - 1) * 1.6,
      targetScore: 85 + (round - 1) * 20,
      thrusterMultiplier: 2.6 + (r - 1) * 0.35
    };
  }

  // --------------------------------------------------------------------------
  // BACKGROUND STADIUM & JUMBOTRON ("DON'T GO IN THE WATER!")
  // --------------------------------------------------------------------------
  createStadiumBackdrop() {
    const sky = this.add.graphics();
    sky.fillGradientStyle(0x0b0f1d, 0x0b0f1d, 0x182238, 0x182238, 1);
    sky.fillRect(0, 0, this.worldWidth, this.worldHeight);
    sky.setScrollFactor(0.1);

    const skyline = this.add.graphics();
    skyline.setScrollFactor(0.2);
    skyline.fillStyle(0x131a2b, 1);
    for (let x = 0; x < 1600; x += 110) {
      const h = 150 + ((x * 37) % 130);
      skyline.fillRect(x, 510 - h, 95, h + 110);
      if (x % 220 === 0) {
        skyline.fillRect(x + 25, 510 - h - 65, 16, 65);
        skyline.fillStyle(0xf97316, 0.85);
        skyline.fillRect(x + 27, 510 - h - 68, 12, 5);
        skyline.fillStyle(0x131a2b, 1);
      }
    }

    // Looming Giant Beastmaster Boss Silhouette in the fog
    const beast = this.add.graphics();
    beast.setScrollFactor(0.15);
    beast.fillStyle(0x0e1320, 0.92);
    beast.fillRect(520, 175, 190, 320);
    beast.fillRect(475, 210, 280, 120);
    beast.fillRect(490, 125, 26, 60);
    beast.fillRect(710, 125, 26, 60);
    beast.fillRect(570, 130, 90, 50);
    beast.fillStyle(0xef4444, 0.92);
    beast.fillRect(595, 150, 12, 6);
    beast.fillRect(628, 150, 12, 6);

    // Stadium Spotlight Beams & Trusses
    const trusses = this.add.graphics();
    trusses.setScrollFactor(0.45);
    for (let x = 80; x < 2900; x += 480) {
      trusses.fillStyle(0x1e293b, 0.95);
      trusses.fillRect(x, 0, 14, 580);
      trusses.fillRect(x + 56, 0, 14, 580);
      trusses.lineStyle(3, 0x334155, 0.9);
      for (let y = 20; y < 560; y += 44) {
        trusses.strokeLineShape(new Phaser.Geom.Line(x + 7, y, x + 63, y + 44));
        trusses.strokeLineShape(new Phaser.Geom.Line(x + 63, y, x + 7, y + 44));
      }

      trusses.fillStyle(0x334155, 1);
      trusses.fillRect(x - 10, 85, 90, 48);
      trusses.fillStyle(0xfef9c3, 0.95);
      for (let lx = 0; lx < 4; lx++) {
        for (let ly = 0; ly < 3; ly++) {
          trusses.fillRect(x - 2 + lx * 20, 92 + ly * 13, 12, 8);
        }
      }
      trusses.fillStyle(0xfef08a, 0.05);
      trusses.fillTriangle(x + 35, 130, x - 150, 600, x + 220, 600);
    }

    // Neon Crowd Silhouettes
    const crowd = this.add.graphics();
    crowd.setScrollFactor(0.55);
    crowd.fillStyle(0x0f172a, 1);
    crowd.fillRect(0, 445, 3100, 185);
    const neonColors = [0x38bdf8, 0xe879f9, 0xfacc15, 0x4ade80];
    for (let x = 20; x < 3050; x += 28) {
      const h = 24 + ((x * 19) % 14);
      crowd.fillStyle(0x1e293b, 1);
      crowd.fillRect(x, 475 - h, 16, h + 25);
      crowd.fillCircle(x + 8, 470 - h, 6);
      if (x % 56 === 0) {
        const col = neonColors[(x / 56) % neonColors.length];
        crowd.lineStyle(2, col, 0.85);
        crowd.strokeRect(x + 12, 442 - (x % 12), 18, 12);
      }
    }

    // Arena Jumbotron Signs: "DON'T GO IN THE WATER!"
    const jumbotronPositions = [310, 1180, 2050, 2720];
    jumbotronPositions.forEach(jx => {
      const board = this.add.graphics();
      board.setScrollFactor(0.5);
      board.fillStyle(0x1e293b, 1);
      board.fillRect(jx - 6, 174, 332, 86);
      board.fillStyle(0x090d16, 1);
      board.fillRect(jx, 180, 320, 74);
      board.lineStyle(3, 0x475569, 1);
      board.strokeRect(jx, 180, 320, 74);

      const signText = this.add.text(jx + 160, 217, "DON'T GO IN\nTHE WATER!", {
        fontFamily: '"Press Start 2P"',
        fontSize: '16px',
        color: '#fb923c',
        align: 'center',
        lineSpacing: 8
      }).setOrigin(0.5).setScrollFactor(0.5);
      signText.setShadow(0, 0, '#ea580c', 8, true, true);
    });
  }

  // --------------------------------------------------------------------------
  // COMPLETE OBSTACLE COURSE CONSTRUCTION (x = 120 to x = 4720)
  // --------------------------------------------------------------------------
  createPlatform(x, y, w, h) {
    const cols = Math.max(1, Math.round(w / 32));
    const rows = Math.max(1, Math.round(h / 32));
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const px = x + c * 32 + 16;
        const py = y + r * 32 + 16;
        const tile = this.staticPlatforms.create(px, py, 'plat_industrial');
        tile.refreshBody();
      }
    }
  }

  buildCourse(diff) {
    const addTriangle = (x, y) => {
      const tri = this.trianglesGroup.create(x, y, 'tri_off');
      tri.setScale(1.25);
      tri.refreshBody();
      tri.collected = false;
      this.totalTriangles++;
      this.tweens.add({
        targets: tri,
        y: y - 5,
        duration: 750 + (x % 300),
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });
      return tri;
    };

    const addMegaThruster = (x, y, id) => {
      const th = this.thrustersGroup.create(x, y, 'thruster_ready');
      th.setScale(1.38);
      th.refreshBody();
      th.thrusterId = id;
      th.activated = false;
      this.add.text(x, y - 34, `MEGA\nTHRUSTER ${id}`, {
        fontFamily: '"Press Start 2P"',
        fontSize: '8px',
        color: '#fdba74',
        align: 'center'
      }).setOrigin(0.5);
      return th;
    };

    const addClimbRope = (x, topY, bottomY) => {
      for (let y = topY; y < bottomY; y += 32) {
        this.add.image(x, y + 16, 'climb_rope').setScale(1.35);
      }
      const height = bottomY - topY;
      const zone = this.add.zone(x, topY + height / 2, 36, height + 18);
      this.physics.add.existing(zone, true);
      this.climbZones.add(zone);
    };

    const addCourseSign = (x, y, label, color = '#fde047') => {
      this.add.text(x, y, label, {
        fontFamily: '"Press Start 2P"',
        fontSize: '12px',
        color: color,
        stroke: '#090d16',
        strokeThickness: 4,
        align: 'center'
      }).setOrigin(0.5);
    };

    const createTreadmill = (x, y, widthBlocks, speed) => {
      this.createPlatform(x, y + 32, widthBlocks * 32, 160);
      const beltWidth = widthBlocks * 32;
      const belt = this.add.tileSprite(x + beltWidth / 2, y + 16, beltWidth, 32, 'plat_industrial');
      const zone = this.physics.add.staticSprite(x + beltWidth / 2, y + 16, 'plat_industrial');
      zone.setDisplaySize(beltWidth, 32);
      zone.setAlpha(0);
      zone.refreshBody();

      const gearL = this.add.circle(x + 14, y + 16, 11, 0x94a3b8).setStrokeStyle(3, 0x0f172a);
      const gearR = this.add.circle(x + beltWidth - 14, y + 16, 11, 0x94a3b8).setStrokeStyle(3, 0x0f172a);

      this.treadmills.push({
        beltSprite: belt,
        platform: zone,
        gearL,
        gearR,
        beltSpeed: speed
      });
    };

    // ========================================================================
    // SECTION 1: START DECK (x = 120, y = 500, w = 380, h = 220)
    // ========================================================================
    this.createPlatform(120, 500, 384, 224);

    // Cyan Neon Truss Start Arch
    const startArch = this.add.graphics();
    startArch.lineStyle(4, 0x22d3ee, 1);
    startArch.strokeRect(165, 360, 12, 140);
    startArch.strokeRect(275, 360, 12, 140);
    startArch.strokeRect(165, 360, 122, 24);
    addCourseSign(226, 336, 'START', '#fde047');

    // Warm-up triangles on start deck
    addTriangle(345, 458);
    addTriangle(415, 458);

    // ========================================================================
    // SECTION 2: ANGLED "CHRAMP" LAUNCH PAD (x = 490, y = 475)
    // ========================================================================
    const chrampSprite = this.add.sprite(490, 480, 'chramp_pad').setScale(1.45);
    chrampSprite.setAngle(-22);
    const chrampZone = this.add.zone(490, 475, 72, 48);
    this.physics.add.existing(chrampZone, true);
    this.springPads.push({ sprite: chrampSprite, zone: chrampZone, vx: 345, vy: -710 });
    addCourseSign(490, 412, 'CHRAMP', '#fde047');

    // High arc triangles launched from Chramp
    addTriangle(580, 325);
    addTriangle(665, 265);
    addTriangle(750, 290);

    // ========================================================================
    // SECTION 3: "JUMP / CLIME" ROCKY MOUNTAIN CRAG & MEGA THRUSTER #1 (x = 760 -> 1180)
    // ========================================================================
    addCourseSign(970, 220, 'JUMP / CLIME', '#fde047');

    // Stepped pyramid rock crag rising from water up to y = 320
    for (let row = 0; row < 8; row++) {
      const cols = 12 - row;
      const startX = 760 + Math.floor(row * 16);
      const y = 576 - row * 32;
      for (let c = 0; c < cols; c++) {
        const block = this.staticPlatforms.create(startX + c * 32 + 16, y + 16, 'rock_block');
        block.refreshBody();
      }
    }

    // Wooden mid-ledge on left & summit deck at top
    const midLedge = this.staticPlatforms.create(775, 445, 'wood_plank').setScale(2.4, 1.2);
    midLedge.refreshBody();
    const summitDeck = this.staticPlatforms.create(970, 320, 'wood_plank').setScale(4.2, 1.25);
    summitDeck.refreshBody();

    // Climbable ropes on both left and right sides of Crag
    addClimbRope(815, 320, 505);
    addClimbRope(1125, 320, 505);

    // Triangles & MEGA THRUSTER #1 at Crag Summit!
    addTriangle(775, 402);
    addTriangle(900, 278);
    addMegaThruster(970, 278, 1);
    addTriangle(1040, 278);

    // ========================================================================
    // SECTION 4: "SINKING TOOB" SUSPENDED ON CHAINS (x = 1360, y = 435)
    // ========================================================================
    addCourseSign(1430, 255, 'SINKING TOOB', '#fde047');

    const createSinkingToob = (x, baseY) => {
      const chainGfx = this.add.graphics();
      const tube = this.physics.add.sprite(x, baseY, 'sinking_toob').setScale(1.4);
      tube.body.setImmovable(true);
      tube.body.setAllowGravity(false);
      tube.refreshBody();

      const item = {
        bodyObj: tube,
        chainGfx: chainGfx,
        x: x,
        baseY: baseY,
        beingSteppedOn: false,
        sinkSpeed: diff.tubeSinkSpeed
      };
      this.sinkingTubes.push(item);
      return item;
    };

    createSinkingToob(1330, 445);
    addTriangle(1330, 355);
    addTriangle(1445, 370);
    createSinkingToob(1565, 455);
    addTriangle(1565, 365);

    // ========================================================================
    // SECTION 5: "TREADMILL" CONVEYOR PLATFORM (x = 1800, y = 455)
    // ========================================================================
    addCourseSign(1930, 335, 'TREADMILL', '#fde047');
    createTreadmill(1760, 460, 8, diff.treadmillSpeed);
    addTriangle(1840, 415);
    addTriangle(1940, 415);

    // Upper bonus scaffold above treadmill with climbable rope
    const highScaffold = this.staticPlatforms.create(2055, 335, 'wood_plank').setScale(3.8, 1.15);
    highScaffold.refreshBody();
    addClimbRope(1995, 335, 460);
    addTriangle(2045, 292);
    addTriangle(2105, 292);

    // ========================================================================
    // SECTION 6: "MEGA CHRAMP!" & SKY DECK WITH MEGA THRUSTER #2 (x = 2230 -> 3180)
    // ========================================================================
    this.createPlatform(2140, 480, 224, 240);
    const chramp2Sprite = this.add.sprite(2285, 468, 'chramp_pad').setScale(1.45);
    chramp2Sprite.setAngle(-20);
    const chramp2Zone = this.add.zone(2285, 460, 74, 48);
    this.physics.add.existing(chramp2Zone, true);
    this.springPads.push({ sprite: chramp2Sprite, zone: chramp2Zone, vx: 375, vy: -720 });
    addCourseSign(2285, 398, 'MEGA CHRAMP!', '#38bdf8');

    // Sky triangle arc leading up to Sky Deck
    addTriangle(2405, 300);
    addTriangle(2505, 245);
    addTriangle(2605, 270);

    // Elevated Sky Deck holding MEGA THRUSTER #2
    this.createPlatform(2680, 345, 256, 32);
    addMegaThruster(2785, 302, 2);
    addTriangle(2865, 302);

    // Wide lower stepping islands below sky deck so nobody gets stuck
    this.createPlatform(2450, 500, 160, 220);
    this.createPlatform(2710, 500, 192, 220);
    addTriangle(2805, 458);

    // Safe transition platform before Rope Bridge
    this.createPlatform(3040, 485, 192, 235);
    addTriangle(3135, 442);

    // ========================================================================
    // SECTION 7: "JUMP / BRIG" WOODEN ROPE SUSPENSION BRIDGE (x = 3450 -> 3980)
    // ========================================================================
    addCourseSign(3690, 375, 'JUMP / BRIG', '#fde047');
    this.createPlatform(3310, 485, 128, 235);

    const plankCount = 12;
    for (let i = 0; i < plankCount; i++) {
      const px = 3475 + i * 38;
      const sag = Math.sin((i / (plankCount - 1)) * Math.PI) * 16;
      const py = 485 + sag;
      const plank = this.physics.add.sprite(px, py, 'wood_plank').setScale(1.18, 1.18);
      plank.body.setImmovable(true);
      plank.body.setAllowGravity(false);
      plank.refreshBody();

      this.bridgePlanks.push({
        sprite: plank,
        origY: py,
        stepped: false,
        timer: 0,
        falling: false,
        solidOnly: diff.bridgeSolid,
        dropDelay: diff.bridgeDropDelay
      });

      if (i % 3 === 1) {
        addTriangle(px, py - 44);
      }
    }

    // ========================================================================
    // SECTION 8: FINAL SPRINT & "FINISH" SLAM BUZZER (x = 4020 -> 4720)
    // ========================================================================
    this.createPlatform(3980, 475, 160, 245);
    addTriangle(4060, 432);

    // Final Treadmill sprint before Finish Deck
    createTreadmill(4170, 465, 4, diff.treadmillSpeed * 1.05);
    addTriangle(4234, 412);

    // Finish Deck (x = 4340, y = 450, w = 384, h = 270)
    this.createPlatform(4340, 450, 384, 272);

    // Magenta Neon Truss Finish Arch
    const finArch = this.add.graphics();
    finArch.lineStyle(4, 0xe879f9, 1);
    finArch.strokeRect(4440, 310, 14, 140);
    finArch.strokeRect(4585, 310, 14, 140);
    finArch.strokeRect(4440, 310, 159, 26);
    addCourseSign(4520, 286, 'FINISH', '#fde047');

    // Checkered Flag Pole next to Slam Buzzer
    const flagGfx = this.add.graphics();
    flagGfx.fillStyle(0xe2e8f0, 1);
    flagGfx.fillRect(4566, 378, 4, 72);
    for (let fx = 0; fx < 4; fx++) {
      for (let fy = 0; fy < 3; fy++) {
        flagGfx.fillStyle((fx + fy) % 2 === 0 ? 0xffffff : 0x090d16, 1);
        flagGfx.fillRect(4570 + fx * 6, 380 + fy * 6, 6, 6);
      }
    }

    // Giant Red Slam Buzzer
    const buzzer = this.add.sprite(4515, 430, 'finish_buzzer').setScale(1.35);
    this.tweens.add({
      targets: buzzer,
      scaleX: 1.45,
      scaleY: 1.28,
      duration: 320,
      yoyo: true,
      repeat: -1
    });

    this.finishZone = this.add.zone(4515, 418, 72, 76);
    this.physics.add.existing(this.finishZone, true);
  }

  // --------------------------------------------------------------------------
  // ANIMATED CHURNING WATER HAZARD (y >= 615)
  // --------------------------------------------------------------------------
  createWaterHazard(diff) {
    this.waterGraphics = this.add.graphics().setDepth(20);
    this.waterWaveAmp = diff.waterWaveAmp;
  }

  updateWaterHazard(time) {
    const g = this.waterGraphics;
    g.clear();
    const camLeft = this.cameras.main.scrollX - 40;
    const camRight = camLeft + this.cameras.main.width + 80;
    const baseY = this.waterSurfaceY;

    g.fillStyle(0x0284c7, 0.88);
    g.fillRect(camLeft, baseY + 6, camRight - camLeft, 140);

    for (let x = Math.floor(camLeft / 16) * 16; x < camRight; x += 16) {
      const wave = Math.sin(x * 0.045 + time * 0.0055) * this.waterWaveAmp;
      const wy = Math.round(baseY + wave);
      g.fillStyle(0x38bdf8, 0.95);
      g.fillRect(x, wy, 16, 12);
      g.fillStyle(0xffffff, 0.95);
      g.fillRect(x + 2, wy, 10, 4);
    }
  }

  // --------------------------------------------------------------------------
  // FIXED SCREEN-SPACE ARCADE HUD (Kid-Friendly Live PTS vs GOAL)
  // --------------------------------------------------------------------------
  createArcadeHUD(diff) {
    this.targetScore = diff.targetScore;
    this.goalReachedCelebrated = false;

    const hudBg = this.add.graphics().setScrollFactor(0).setDepth(30);
    hudBg.fillStyle(0x090d16, 0.88);
    hudBg.fillRect(12, 12, 580, 86);
    hudBg.lineStyle(3, 0x38bdf8, 0.95);
    hudBg.strokeRect(12, 12, 580, 86);

    const c = GameState.selectedCountry;
    const a = GameState.selectedAthlete;
    let doOverBadge = '❤️ 1 DO-OVER';
    let badgeColor = '#4ade80';
    if (GameState.isDoOverAttempt) {
      doOverBadge = '⚠️ 2ND RUN!';
      badgeColor = '#fbbf24';
    } else if (!GameState.doOverAvailable) {
      doOverBadge = '💔 USED';
      badgeColor = '#f87171';
    }

    this.hudTopRow = this.add.text(24, 20, `R${GameState.round} • ${a.name} (${c.code})`, {
      fontFamily: '"Press Start 2P"',
      fontSize: '10px',
      color: '#cbd5e1'
    }).setScrollFactor(0).setDepth(31);

    this.hudDoOverText = this.add.text(305, 20, doOverBadge, {
      fontFamily: '"Press Start 2P"',
      fontSize: '10px',
      color: badgeColor
    }).setScrollFactor(0).setDepth(31);

    this.hudTimeText = this.add.text(468, 20, '⏱️ 0.0s', {
      fontFamily: '"Press Start 2P"',
      fontSize: '10px',
      color: '#38bdf8'
    }).setScrollFactor(0).setDepth(31);

    // Big high-contrast Live PTS vs GOAL readout
    this.hudScoreBigText = this.add.text(24, 42, `PTS 0 / ${this.targetScore} GOAL`, {
      fontFamily: '"Press Start 2P"',
      fontSize: '15px',
      color: '#facc15'
    }).setScrollFactor(0).setDepth(31);

    // Live progress bar & star indicators
    this.hudBarGraphics = this.add.graphics().setScrollFactor(0).setDepth(31);
    this.hudStarsText = this.add.text(472, 71, '☆☆☆', {
      fontFamily: '"Press Start 2P"',
      fontSize: '13px',
      color: '#facc15'
    }).setScrollFactor(0).setDepth(31);
  }

  getLivePoints() {
    return (this.trianglesCollected * 5) + this.thruster1Points + this.thruster2Points;
  }

  updateHUD() {
    const livePts = this.getLivePoints();
    const goal = this.targetScore;
    const beatGoal = livePts >= goal;

    this.hudTimeText.setText(`⏱️ ${this.elapsedTime.toFixed(1)}s`);
    this.hudScoreBigText.setText(`PTS ${livePts} / ${goal} GOAL`);
    this.hudScoreBigText.setColor(beatGoal ? '#4ade80' : '#facc15');

    let stars = '☆☆☆';
    if (livePts >= goal + 65) stars = '★★★';
    else if (livePts >= goal + 30) stars = '★★☆';
    else if (beatGoal) stars = '★☆☆';
    this.hudStarsText.setText(stars);

    if (beatGoal && !this.goalReachedCelebrated && this.runStarted) {
      this.goalReachedCelebrated = true;
      this.showFloatingBanner(`★ GOAL BEAT! (${livePts} PTS) ★`, '#4ade80');
    }

    const g = this.hudBarGraphics;
    g.clear();
    const barX = 24;
    const barY = 70;
    const barW = 434;
    const barH = 15;
    g.fillStyle(0x1e293b, 1);
    g.fillRect(barX, barY, barW, barH);
    g.lineStyle(2, 0x475569, 1);
    g.strokeRect(barX, barY, barW, barH);

    const pct = Math.min(1, livePts / Math.max(1, goal));
    if (pct > 0) {
      g.fillStyle(beatGoal ? 0x4ade80 : 0x38bdf8, 1);
      g.fillRect(barX + 2, barY + 2, Math.max(4, (barW - 4) * pct), barH - 4);
    }
  }

  // --------------------------------------------------------------------------
  // OBSTACLE & SCORING INTERACTIONS
  // --------------------------------------------------------------------------
  handleSpringBounce(pad) {
    if (this.player.body.velocity.y >= -50) {
      SFX.springBounce();
      this.player.setVelocity(pad.vx, pad.vy);
      this.boostTimer = 0.38;
      this.tweens.add({
        targets: pad.sprite,
        scaleX: 1.75,
        scaleY: 1.15,
        duration: 90,
        yoyo: true
      });
      this.spawnPopupText(pad.sprite.x, pad.sprite.y - 30, 'BOING!', '#bef264');
    }
  }

  collectTriangle(player, tri) {
    if (tri.collected) return;
    tri.collected = true;
    tri.setTexture('tri_on');
    this.trianglesCollected++;
    SFX.triangleHit();
    this.spawnPopupText(tri.x, tri.y - 16, '+5', '#facc15');
    this.tweens.add({
      targets: tri,
      scaleX: 1.7,
      scaleY: 1.7,
      alpha: 0.45,
      duration: 240
    });
  }

  activateThruster(player, thruster) {
    if (thruster.activated) return;
    thruster.activated = true;
    thruster.setTexture('thruster_done');

    const diff = this.getDifficultyParams(GameState.round);
    // Dynamic speed bonus up to +150 pts based on how fast you reach the thruster
    const speedBonus = Math.max(20, Math.min(150, Math.round(150 - this.elapsedTime * diff.thrusterMultiplier)));

    if (thruster.thrusterId === 1) {
      this.thruster1Points = speedBonus;
    } else {
      this.thruster2Points = speedBonus;
    }

    this.boostTimer = 1.45;
    this.player.setVelocityY(-440);
    SFX.megaThruster();
    this.cameras.main.shake(180, 0.008);
    this.spawnPopupText(thruster.x, thruster.y - 26, `⚡ +${speedBonus} PTS!`, '#fb923c');
  }

  spawnPopupText(x, y, msg, color = '#ffffff') {
    const txt = this.add.text(x, y, msg, {
      fontFamily: '"Press Start 2P"',
      fontSize: '11px',
      color: color,
      stroke: '#090d16',
      strokeThickness: 4,
      align: 'center'
    }).setOrigin(0.5).setDepth(25);

    this.tweens.add({
      targets: txt,
      y: y - 44,
      alpha: 0,
      duration: 950,
      ease: 'Cubic.easeOut',
      onComplete: () => txt.destroy()
    });
  }

  showFloatingBanner(msg, color = '#4ade80') {
    const banner = this.add.text(this.cameras.main.width / 2, 135, msg, {
      fontFamily: '"Press Start 2P"',
      fontSize: '15px',
      color: color,
      backgroundColor: '#090d16cc',
      padding: { x: 14, y: 10 },
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(40);

    this.tweens.add({
      targets: banner,
      alpha: 0,
      y: 112,
      delay: 1450,
      duration: 600,
      onComplete: () => banner.destroy()
    });
  }

  // --------------------------------------------------------------------------
  // SCORE CALCULATION & RUN COMPLETION / WATER WIPEOUT
  // --------------------------------------------------------------------------
  calculateScoreBreakdown(completed) {
    const trianglePts = this.trianglesCollected * 5;
    const thruster1Pts = this.thruster1Points;
    const thruster2Pts = this.thruster2Points;
    const timeBonus = completed ? Math.max(0, Math.round(75 - this.elapsedTime * 1.15)) : 0;
    const total = completed ? (trianglePts + thruster1Pts + thruster2Pts + timeBonus) : 0;

    return {
      completed,
      time: this.elapsedTime,
      trianglesCount: this.trianglesCollected,
      totalTriangles: this.totalTriangles,
      trianglePts,
      thruster1Pts,
      thruster2Pts,
      timeBonus,
      total
    };
  }

  spawnFireworks(cx, cy) {
    const colors = [0xfacc15, 0x4ade80, 0x38bdf8, 0xf472b6, 0xfb923c];
    for (let burst = 0; burst < 4; burst++) {
      this.time.delayedCall(burst * 160, () => {
        const bx = cx - 90 + burst * 60;
        const by = cy - 90 - (burst % 2) * 45;
        const col = colors[burst % colors.length];
        for (let i = 0; i < 14; i++) {
          const angle = (Math.PI * 2 * i) / 14;
          const spark = this.add.rectangle(bx, by, 6, 6, col).setDepth(28);
          this.tweens.add({
            targets: spark,
            x: bx + Math.cos(angle) * 75,
            y: by + Math.sin(angle) * 75,
            alpha: 0,
            duration: 650,
            ease: 'Cubic.easeOut',
            onComplete: () => spark.destroy()
          });
        }
      });
    }
  }

  completeCourse() {
    if (this.runFinished || this.runFailed) return;
    this.runFinished = true;
    clearAllTouchInputs();
    this.player.setVelocity(0, 0);
    SFX.buzzer();
    this.cameras.main.flash(280, 255, 255, 255);
    this.spawnFireworks(this.player.x, this.player.y - 30);
    this.spawnPopupText(this.player.x, this.player.y - 44, 'BUZZER SLAMMED!', '#4ade80');

    const result = this.calculateScoreBreakdown(true);
    this.time.delayedCall(900, () => {
      window.onRunEnded(result);
    });
  }

  triggerWaterWipeout() {
    if (this.runFinished || this.runFailed) return;
    this.runFailed = true;
    clearAllTouchInputs();
    SFX.splash();
    this.cameras.main.shake(240, 0.012);
    this.spawnPopupText(this.player.x, this.waterSurfaceY - 24, 'SPLASH! IN THE WATER!', '#38bdf8');

    const result = this.calculateScoreBreakdown(false);
    this.time.delayedCall(850, () => {
      window.onRunEnded(result);
    });
  }

  // --------------------------------------------------------------------------
  // FRAME UPDATE LOOP
  // --------------------------------------------------------------------------
  update(time, delta) {
    const dt = delta / 1000;
    this.updateWaterHazard(time);

    // Update Sinking Toobs
    this.sinkingTubes.forEach(tube => {
      if (tube.beingSteppedOn) {
        tube.bodyObj.y += tube.sinkSpeed * dt;
      } else if (tube.bodyObj.y > tube.baseY) {
        tube.bodyObj.y = Math.max(tube.baseY, tube.bodyObj.y - 36 * dt);
      }
      tube.bodyObj.refreshBody();
      tube.beingSteppedOn = false;

      tube.chainGfx.clear();
      tube.chainGfx.lineStyle(4, 0x64748b, 1);
      tube.chainGfx.strokeLineShape(new Phaser.Geom.Line(tube.x - 24, 0, tube.x - 24, tube.bodyObj.y - 45));
      tube.chainGfx.strokeLineShape(new Phaser.Geom.Line(tube.x + 24, 0, tube.x + 24, tube.bodyObj.y - 45));
    });

    // Update Treadmill Belts & Gears
    this.treadmills.forEach(tm => {
      tm.beltSprite.tilePositionX += tm.beltSpeed * dt;
      tm.gearL.rotation -= 4 * dt;
      tm.gearR.rotation -= 4 * dt;
    });

    // Update Rope Bridge Planks (solid in Round 1, crumbling in Round 2+)
    this.bridgePlanks.forEach(bp => {
      if (!bp.solidOnly && bp.stepped && !bp.falling) {
        bp.timer += dt;
        bp.sprite.y = bp.origY + Math.sin(time * 0.06) * 3;
        if (bp.timer >= bp.dropDelay) {
          bp.falling = true;
        }
      }
      if (bp.falling) {
        bp.sprite.y += 280 * dt;
        bp.sprite.refreshBody();
      }
    });

    if (!this.runStarted || this.runFinished || this.runFailed) {
      this.updateHUD();
      return;
    }

    this.elapsedTime += dt;
    if (this.boostTimer > 0) this.boostTimer -= dt;

    // Input aggregation (Keyboard + Mobile Touch)
    const left = this.cursors.left.isDown || this.keys.A.isDown || TouchInput.left;
    const right = this.cursors.right.isDown || this.keys.D.isDown || TouchInput.right;
    const up = this.cursors.up.isDown || this.keys.W.isDown || TouchInput.jumpHeld;
    const down = this.cursors.down.isDown || this.keys.S.isDown;
    const jumpJustPressed =
      Phaser.Input.Keyboard.JustDown(this.cursors.space) ||
      Phaser.Input.Keyboard.JustDown(this.cursors.up) ||
      Phaser.Input.Keyboard.JustDown(this.keys.W) ||
      TouchInput.jumpJustPressed;
    TouchInput.jumpJustPressed = false;

    const onClimbZone = this.physics.overlap(this.player, this.climbZones);

    if (this.player.body.touching.down) {
      this.coyoteTimer = 0.13;
    } else {
      this.coyoteTimer -= dt;
    }

    if (jumpJustPressed) {
      this.jumpBufferTimer = 0.13;
    } else {
      this.jumpBufferTimer -= dt;
    }

    // Horizontal Movement
    const baseRunSpeed = this.boostTimer > 0 ? 365 : 270;
    let vx = this.onTreadmillSpeed;
    if (left) {
      vx += -baseRunSpeed;
      this.player.setFlipX(true);
    } else if (right) {
      vx += baseRunSpeed;
      this.player.setFlipX(false);
    }
    this.player.setVelocityX(vx);
    this.onTreadmillSpeed = 0;

    // Vertical Movement (Climbing vs Jumping)
    if (onClimbZone && (up || down)) {
      this.player.body.setAllowGravity(false);
      this.player.setVelocityY(up ? -235 : 215);
      this.player.setTexture('player_climb');
    } else {
      this.player.body.setAllowGravity(true);

      if (this.jumpBufferTimer > 0 && (this.coyoteTimer > 0 || onClimbZone)) {
        this.player.setVelocityY(-535);
        this.jumpBufferTimer = 0;
        this.coyoteTimer = 0;
        SFX.jump();
      }

      if (!this.player.body.touching.down) {
        this.player.setTexture('player_jump');
      } else if (Math.abs(vx) > 15) {
        const runFrame = Math.floor(time / 95) % 2 === 0 ? 'player_run1' : 'player_run2';
        this.player.setTexture(runFrame);
      } else {
        this.player.setTexture('player_idle');
      }
    }

    // Check Water Hazard Contact ("DON'T GO IN THE WATER!" at y >= 615)
    if (this.player.y + 18 >= this.waterSurfaceY) {
      this.triggerWaterWipeout();
    }

    this.updateHUD();
  }
}
